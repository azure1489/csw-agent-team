[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engineapi",
    "crates/harvest",
    "crates/kb",
    "crates/judge",
    "crates/deepcheck",
    "crates/deliver",
    "crates/mcpsrv",
    "crates/collector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 内部
csw-collector-core = { path = "crates/core" }
csw-collector-engineapi = { path = "crates/engineapi" }
csw-collector-harvest = { path = "crates/harvest" }
csw-collector-kb = { path = "crates/kb" }
csw-collector-judge = { path = "crates/judge" }
csw-collector-deepcheck = { path = "crates/deepcheck" }
csw-collector-deliver = { path = "crates/deliver" }
csw-collector-mcpsrv = { path = "crates/mcpsrv" }

# 基础
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

# 重依赖（版本钉死；升级前重跑阶段 0.2 的交叉编译验证）
# 钉 0.37.1 而不是最新的 0.39.0：0.38 / 0.39 的 src/job.rs 无条件引用了只在
# remote feature 下存在的 Error::Http，不开 feature 编不过（上游回归）。开 remote
# 会拖进第二个 major 的 reqwest（0.12）加 tonic / arrow-flight，且带回 aws-lc-rs。
# 0.37.1：lance 10.0.0 · arrow 58.x · MSRV 1.91 · jieba 分词器默认已启用 · 构建需 protoc。
lancedb = "=0.37.1"
rusqlite = { version = "0.40", features = ["bundled"] }
# rustls 走 ring：aws-lc-rs 要 cmake + nasm，交叉编译到 x86_64 linux 很难过
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider", "http2", "json", "charset", "stream", "multipart",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "fs", "compression-gzip"] }
blake3 = "1"
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
futures = "0.3"
toml = "1"
utoipa = "5"
jieba-rs = "0.10"
wiremock = "0.6"
tempdir = "0.3"
rand = "0.9"

[profile.release]
# 生产二进制跑在 agent 主机，体积与启动比编译时长重要
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "debuginfo"
panic = "unwind"    # 采集轮要能捕获单步 panic 而不整进程退出
